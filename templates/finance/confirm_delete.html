{% extends "layouts/app.html" %}
{% load icons %}
{% block title %}Eliminar · CRIS{% endblock %}

{% block content %}
{% include "finance/_nav.html" %}
<div class="form-card form-card--narrow center">
  <span class="empty__icon empty__icon--danger">{% icon "trash" 36 %}</span>
  <h1 class="h-md">¿Eliminar “{{ object }}”?</h1>
  <p class="meta-muted">Esta acción no se puede deshacer.</p>
  <form method="post" class="form-actions center">
    {% csrf_token %}
    <a href="{{ view.success_url }}" class="btn-secondary">Cancelar</a>
    <button type="submit" class="btn-danger">Sí, eliminar</button>
  </form>
</div>
{% endblock %}
